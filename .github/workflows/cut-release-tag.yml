name: Cut release tag

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'Release Harness Remote ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        run: |
          VERSION=$(node -p "require('./web/package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::web/package.json has no version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create annotated release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; keeping the existing release tag."
          else
            BODY=$(git log -1 --format=%b "$GITHUB_SHA")
            if [ -z "${BODY//[[:space:]]/}" ]; then
              echo "::error::Release commit has no body; annotated release notes would be empty." >&2
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/release-tag-message.txt"
            # Verbatim: the default cleanup drops every line starting with '#', which is every Markdown
            # heading in the release notes (v3.3.0 was published without its section titles).
            git tag -a "$TAG" -F "$RUNNER_TEMP/release-tag-message.txt" --cleanup=verbatim "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      # Tag pushes made with GITHUB_TOKEN intentionally do not trigger other workflows. Dispatching
      # the tag-aware builders is the supported exception and keeps Android as the release owner
      # while Desktop waits for that release and attaches its platform artifacts.
      - name: Dispatch tagged release builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run android-apk.yml --ref "$TAG"
          gh workflow run desktop-apps.yml --ref "$TAG"

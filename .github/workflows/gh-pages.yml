name: Deploy web app to GitHub Pages

# Every merge to main, deliberately. The hosted app is the staging surface: the point is to exercise
# what just landed on a real phone against a real server, which only works if it is there without
# waiting for a release. The APK stays release-only, so the two are not redundant — one is what
# people install, this is what we test. The suites below gate it, so a broken merge does not deploy.
"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/gh-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type-check
        run: npx tsc -b
        working-directory: web

      # Deploying on every merge only works if a bad merge cannot reach the URL, so this gates on the
      # same suites as the APK release rather than on the type-check alone.
      - name: Run web regression tests
        run: |
          npm run test:i18n
          npm run test:config
          npm run test:ui
          npm run test:settings
          npm run test:model
          npm run test:events
          npm run test:profiles
          npm run test:markdown
          npm run test:attachments
          npm run test:agent-runs
        working-directory: web

      - name: Build web app
        # GitHub Pages serves project sites from /<repo>/, so the app's asset and PWA URLs need
        # that prefix baked in at build time.
        run: npx vite build --base="/${{ github.event.repository.name }}/"
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

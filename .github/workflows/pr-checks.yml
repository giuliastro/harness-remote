name: PR checks

"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'web/**'
      - 'bridge/**'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: write

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-targeted-fix:
    if: github.head_ref == 'fix/v3-settings-pi-history'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/v3-settings-pi-history
          fetch-depth: 0

      - name: Apply Settings and PI history fixes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "web/src/App.tsx",
              '''  useEffect(() => {\n    if (!isDesktop || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return\n    autoSelectAttemptedRef.current = true\n    openSession(sessions[0].id, sessions[0].directory).catch(() => undefined)\n  }, [isDesktop, selectedID, sessions])''',
              '''  useEffect(() => {\n    // Loading or reconnecting a server while Settings or Help is open must never navigate away\n    // from that panel. Settings autosaves a valid password after a short pause; the resulting\n    // session refresh is not an instruction to open the first conversation.\n    if (!isDesktop || view === "settings" || view === "help" || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return\n    autoSelectAttemptedRef.current = true\n    openSession(sessions[0].id, sessions[0].directory).catch(() => undefined)\n  }, [isDesktop, view, selectedID, sessions])'''
          )

          replace_once(
              "bridge/src/acp-service.js",
              '''  #preserveListedTimestamps\n  #reloadOnHistoryRefresh\n  constructor(acp, {\n    snapshotDirectory,\n    historyLoader,\n    preserveListedTimestamps = false,\n    reloadOnHistoryRefresh = true,\n    actionProviders = []\n  } = {}) {''',
              '''  #preserveListedTimestamps\n  #reloadOnHistoryRefresh\n  #replaySettleMs\n  constructor(acp, {\n    snapshotDirectory,\n    historyLoader,\n    preserveListedTimestamps = false,\n    reloadOnHistoryRefresh = true,\n    replaySettleMs = 0,\n    actionProviders = []\n  } = {}) {'''
          )
          replace_once(
              "bridge/src/acp-service.js",
              '''    this.#preserveListedTimestamps = preserveListedTimestamps\n    this.#reloadOnHistoryRefresh = reloadOnHistoryRefresh\n    this.#actionProviders = actionProviders''',
              '''    this.#preserveListedTimestamps = preserveListedTimestamps\n    this.#reloadOnHistoryRefresh = reloadOnHistoryRefresh\n    this.#replaySettleMs = replaySettleMs\n    this.#actionProviders = actionProviders'''
          )
          replace_once(
              "bridge/src/acp-service.js",
              '''      const result = await this.#acp.request("session/load", { sessionId: sessionID, cwd: session.cwd, mcpServers: [] }, 300_000)\n      this.#rememberConfigOptions(sessionID, result.configOptions)\n      const replayedMessages = mergeFragmentedPiSnapshot(this.#messages.get(sessionID) ?? [])''',
              '''      const result = await this.#acp.request("session/load", { sessionId: sessionID, cwd: session.cwd, mcpServers: [] }, 300_000)\n      // PI can resolve session/load just before its final replay notifications drain from stdout,\n      // especially through the Windows cmd/npx pipe. Profiles can opt into a short replay tail so\n      // those assistant chunks remain historical output instead of being rejected as unsolicited\n      // live output. Other ACP harnesses keep the zero-delay default.\n      if (this.#replaySettleMs > 0) {\n        await new Promise((resolve) => setTimeout(resolve, this.#replaySettleMs))\n      }\n      this.#rememberConfigOptions(sessionID, result.configOptions)\n      const replayedMessages = mergeFragmentedPiSnapshot(this.#messages.get(sessionID) ?? [])'''
          )

          replace_once(
              "bridge/src/harness-profiles.js",
              '''    preserveListedTimestamps: true,\n    reloadOnHistoryRefresh: false,\n    capabilities: {\n      ...COMMON_CAPABILITIES,\n      models: true,\n      todos: false,''',
              '''    preserveListedTimestamps: true,\n    reloadOnHistoryRefresh: false,\n    // PI may flush the last replay chunks just after session/load resolves, most visibly on Windows.\n    replaySettleMs: 250,\n    capabilities: {\n      ...COMMON_CAPABILITIES,\n      models: true,\n      todos: false,'''
          )

          replace_once(
              "bridge/src/cli.js",
              '''      preserveListedTimestamps: profile.preserveListedTimestamps,\n      reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh\n    }''',
              '''      preserveListedTimestamps: profile.preserveListedTimestamps,\n      reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh,\n      replaySettleMs: profile.replaySettleMs\n    }'''
          )

          replace_once(
              "bridge/src/daemon-cli.js",
              '''        preserveListedTimestamps: profile.preserveListedTimestamps,\n        hiddenSessionIDs: modelCatalog.hiddenSessionIDs,\n        reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh\n      }''',
              '''        preserveListedTimestamps: profile.preserveListedTimestamps,\n        hiddenSessionIDs: modelCatalog.hiddenSessionIDs,\n        reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh,\n        replaySettleMs: profile.replaySettleMs\n      }'''
          )
          replace_once(
              "bridge/src/daemon-cli.js",
              '''      preserveListedTimestamps: primaryProfile.preserveListedTimestamps,\n      hiddenSessionIDs: daemon.hostEntry(primaryProfile.id).modelCatalog.hiddenSessionIDs,\n      reloadOnHistoryRefresh: primaryProfile.reloadOnHistoryRefresh\n    }''',
              '''      preserveListedTimestamps: primaryProfile.preserveListedTimestamps,\n      hiddenSessionIDs: daemon.hostEntry(primaryProfile.id).modelCatalog.hiddenSessionIDs,\n      reloadOnHistoryRefresh: primaryProfile.reloadOnHistoryRefresh,\n      replaySettleMs: primaryProfile.replaySettleMs\n    }'''
          )

          ui_test = Path("web/src/ui-regression.test.mjs")
          ui = ui_test.read_text()
          test_name = 'desktop session auto-select never navigates away from Settings or Help'
          if test_name not in ui:
              ui += dedent('''

              test("desktop session auto-select never navigates away from Settings or Help", () => {
                const source = readFileSync(new URL("./App.tsx", import.meta.url), "utf8")
                const guard = 'if (!isDesktop || view === "settings" || view === "help" || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return'
                assert.ok(source.includes(guard), "desktop auto-select must preserve explicit Settings and Help views")
              })
              ''')
              ui_test.write_text(ui)

          Path("bridge/test/pi-replay-settle.test.js").write_text(dedent('''
          import test from "node:test"
          import assert from "node:assert/strict"
          import { EventEmitter } from "node:events"
          import { AcpService } from "../src/acp-service.js"

          class LateReplayAcp extends EventEmitter {
            async listSessions() {
              return [{ sessionId: "pi-session", cwd: process.cwd(), title: "PI history", updatedAt: new Date().toISOString() }]
            }

            async request(method, params) {
              if (method !== "session/load") throw new Error(`Unexpected request: ${method}`)
              const sessionId = params.sessionId
              this.emit("notification", {
                method: "session/update",
                params: {
                  sessionId,
                  update: {
                    sessionUpdate: "user_message_chunk",
                    messageId: "user-1",
                    content: { type: "text", text: "First prompt" }
                  }
                }
              })
              setTimeout(() => {
                this.emit("notification", {
                  method: "session/update",
                  params: {
                    sessionId,
                    update: {
                      sessionUpdate: "agent_message_chunk",
                      messageId: "assistant-1",
                      content: { type: "text", text: "First answer" }
                    }
                  }
                })
              }, 20)
              return { configOptions: [] }
            }
          }

          test("PI replay settle captures assistant chunks emitted after session/load resolves", async () => {
            const service = new AcpService(new LateReplayAcp(), { replaySettleMs: 60 })
            const messages = await service.messages("pi-session", true)
            assert.deepEqual(
              messages.map((message) => ({ role: message.info.role, text: message.parts.map((part) => part.text ?? "").join("") })),
              [
                { role: "user", text: "First prompt" },
                { role: "assistant", text: "First answer" }
              ]
            )
          })
          '''))

      - name: Restore workflow and publish patch
        run: |
          git fetch origin v3/taskdesk
          git show origin/v3/taskdesk:.github/workflows/pr-checks.yml > .github/workflows/pr-checks.yml
          git rm -f .github/workflows/apply-settings-pi-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-checks.yml web/src/App.tsx web/src/ui-regression.test.mjs bridge/src/acp-service.js bridge/src/harness-profiles.js bridge/src/cli.js bridge/src/daemon-cli.js bridge/test/pi-replay-settle.test.js
          git commit -m "fix(v3): preserve settings and complete PI history replay"
          git push origin HEAD:fix/v3-settings-pi-history

  tests:
    name: Type-check and regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Type-check and build web app
        run: npm run build
        working-directory: web
      - name: Run web regression tests
        run: |
          npm run test:i18n
          npm run test:config
          npm run test:ui
          npm run test:settings
          npm run test:model
          npm run test:events
          npm run test:profiles
          npm run test:markdown
          npm run test:attachments
          npm run test:agent-runs
          npm run test:mutation-coordinator
          npm run test:catalog-guard
          npm run test:machine-payload
          npm run test:platform
          npm run test:completion-audio
        working-directory: web
      - name: Run bridge tests
        run: npm test
        working-directory: bridge

  bridge-platforms:
    name: Bridge tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run bridge tests
        run: npm test
        working-directory: bridge

  apk:
    name: Debug APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
        working-directory: web
      - name: Generate Android app icon assets
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath public --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
        working-directory: web
      - name: Sync Capacitor project
        run: npm run cap:sync:android
        working-directory: web
      - name: Read app version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./web/package.json').version")
          VERSION_CODE=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log((major * 10000) + (minor * 100) + patch)" "$APP_VERSION")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Sync Android version metadata
        run: node web/scripts/sync-android-version.mjs "${{ steps.version.outputs.app_version }}" "${{ steps.version.outputs.version_code }}"
      - name: Give the debug build its own application id
        run: node web/scripts/set-debug-app-id.mjs
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: web/android
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose web/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name the artifact after the commit it was built from
        id: build
        run: echo "sha=$(git rev-parse --short "${{ github.event.pull_request.head.sha || github.sha }}")" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-remote-debug-v${{ steps.version.outputs.app_version }}-${{ steps.build.outputs.sha }}
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Apply settings and PI history fix

on:
  push:
    branches:
      - fix/v3-settings-pi-history

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply settings and PI history fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v3-settings-pi-history
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "web/src/App.tsx",
              '''  useEffect(() => {\n    if (!isDesktop || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return\n    autoSelectAttemptedRef.current = true\n    openSession(sessions[0].id, sessions[0].directory).catch(() => undefined)\n  }, [isDesktop, selectedID, sessions])''',
              '''  useEffect(() => {\n    // Loading/reconnecting a server while Settings or Help is open must never navigate away from\n    // the panel. In particular, Settings autosaves a valid password after a short pause; that\n    // refresh can populate the session list, but it is not an instruction to open a conversation.\n    if (!isDesktop || view === "settings" || view === "help" || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return\n    autoSelectAttemptedRef.current = true\n    openSession(sessions[0].id, sessions[0].directory).catch(() => undefined)\n  }, [isDesktop, view, selectedID, sessions])'''
          )

          replace_once(
              "bridge/src/acp-service.js",
              '''  #preserveListedTimestamps\n  #reloadOnHistoryRefresh\n  constructor(acp, {\n    snapshotDirectory,\n    historyLoader,\n    preserveListedTimestamps = false,\n    reloadOnHistoryRefresh = true,\n    actionProviders = []\n  } = {}) {''',
              '''  #preserveListedTimestamps\n  #reloadOnHistoryRefresh\n  #replaySettleMs\n  constructor(acp, {\n    snapshotDirectory,\n    historyLoader,\n    preserveListedTimestamps = false,\n    reloadOnHistoryRefresh = true,\n    replaySettleMs = 0,\n    actionProviders = []\n  } = {}) {'''
          )
          replace_once(
              "bridge/src/acp-service.js",
              '''    this.#preserveListedTimestamps = preserveListedTimestamps\n    this.#reloadOnHistoryRefresh = reloadOnHistoryRefresh\n    this.#actionProviders = actionProviders''',
              '''    this.#preserveListedTimestamps = preserveListedTimestamps\n    this.#reloadOnHistoryRefresh = reloadOnHistoryRefresh\n    this.#replaySettleMs = replaySettleMs\n    this.#actionProviders = actionProviders'''
          )
          replace_once(
              "bridge/src/acp-service.js",
              '''      const result = await this.#acp.request("session/load", { sessionId: sessionID, cwd: session.cwd, mcpServers: [] }, 300_000)\n      this.#rememberConfigOptions(sessionID, result.configOptions)\n      const replayedMessages = mergeFragmentedPiSnapshot(this.#messages.get(sessionID) ?? [])''',
              '''      const result = await this.#acp.request("session/load", { sessionId: sessionID, cwd: session.cwd, mcpServers: [] }, 300_000)\n      // PI's ACP adapter can resolve session/load before the last replay notifications have drained\n      // from stdout, especially through the Windows cmd/npx pipe. Keep replay mode alive briefly\n      // for profiles that opt in, otherwise those late assistant chunks look like unsolicited live\n      // output and are correctly rejected. Other ACP harnesses keep the zero-delay default.\n      if (this.#replaySettleMs > 0) {\n        await new Promise((resolve) => setTimeout(resolve, this.#replaySettleMs))\n      }\n      this.#rememberConfigOptions(sessionID, result.configOptions)\n      const replayedMessages = mergeFragmentedPiSnapshot(this.#messages.get(sessionID) ?? [])'''
          )

          replace_once(
              "bridge/src/harness-profiles.js",
              '''    preserveListedTimestamps: true,\n    reloadOnHistoryRefresh: false,\n    capabilities: {\n      ...COMMON_CAPABILITIES,\n      models: true,\n      todos: false,''',
              '''    preserveListedTimestamps: true,\n    reloadOnHistoryRefresh: false,\n    // The PI adapter can finish the session/load RPC just before its final replay chunks are\n    // flushed, most visibly on Windows. Keep the service in replay mode for that short tail.\n    replaySettleMs: 250,\n    capabilities: {\n      ...COMMON_CAPABILITIES,\n      models: true,\n      todos: false,'''
          )

          replace_once(
              "bridge/src/cli.js",
              '''      preserveListedTimestamps: profile.preserveListedTimestamps,\n      reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh\n    }''',
              '''      preserveListedTimestamps: profile.preserveListedTimestamps,\n      reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh,\n      replaySettleMs: profile.replaySettleMs\n    }'''
          )

          daemon = Path("bridge/src/daemon-cli.js")
          daemon_text = daemon.read_text()
          old = '''        preserveListedTimestamps: profile.preserveListedTimestamps,\n        hiddenSessionIDs: modelCatalog.hiddenSessionIDs,\n        reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh\n      }'''
          new = '''        preserveListedTimestamps: profile.preserveListedTimestamps,\n        hiddenSessionIDs: modelCatalog.hiddenSessionIDs,\n        reloadOnHistoryRefresh: profile.reloadOnHistoryRefresh,\n        replaySettleMs: profile.replaySettleMs\n      }'''
          if daemon_text.count(old) != 1:
              raise SystemExit(f"daemon ACP host options: expected one match, found {daemon_text.count(old)}")
          daemon_text = daemon_text.replace(old, new, 1)
          old = '''      preserveListedTimestamps: primaryProfile.preserveListedTimestamps,\n      hiddenSessionIDs: daemon.hostEntry(primaryProfile.id).modelCatalog.hiddenSessionIDs,\n      reloadOnHistoryRefresh: primaryProfile.reloadOnHistoryRefresh\n    }'''
          new = '''      preserveListedTimestamps: primaryProfile.preserveListedTimestamps,\n      hiddenSessionIDs: daemon.hostEntry(primaryProfile.id).modelCatalog.hiddenSessionIDs,\n      reloadOnHistoryRefresh: primaryProfile.reloadOnHistoryRefresh,\n      replaySettleMs: primaryProfile.replaySettleMs\n    }'''
          if daemon_text.count(old) != 1:
              raise SystemExit(f"daemon primary options: expected one match, found {daemon_text.count(old)}")
          daemon.write_text(daemon_text.replace(old, new, 1))

          ui_test = Path("web/src/ui-regression.test.mjs")
          ui = ui_test.read_text()
          marker = 'test("desktop server settings do not close on backdrop click"'
          if marker not in ui:
              ui += '''\n\ntest("desktop session auto-select never navigates away from Settings or Help", () => {\n  const source = readFileSync(new URL("./App.tsx", import.meta.url), "utf8")\n  const guard = 'if (!isDesktop || view === "settings" || view === "help" || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return'\n  assert.ok(source.includes(guard), "desktop auto-select must preserve explicit Settings and Help views")\n})\n'''
          else:
              ui += '''\n\ntest("desktop session auto-select never navigates away from Settings or Help", () => {\n  const source = readFileSync(new URL("./App.tsx", import.meta.url), "utf8")\n  const guard = 'if (!isDesktop || view === "settings" || view === "help" || autoSelectAttemptedRef.current || selectedID || sessions.length === 0) return'\n  assert.ok(source.includes(guard), "desktop auto-select must preserve explicit Settings and Help views")\n})\n'''
          ui_test.write_text(ui)

          Path("bridge/test/pi-replay-settle.test.js").write_text(r'''import test from "node:test"
          import assert from "node:assert/strict"
          import { EventEmitter } from "node:events"
          import { AcpService } from "../src/acp-service.js"

          class LateReplayAcp extends EventEmitter {
            async listSessions() {
              return [{ sessionId: "pi-session", cwd: process.cwd(), title: "PI history", updatedAt: new Date().toISOString() }]
            }

            async request(method, params) {
              if (method !== "session/load") throw new Error(`Unexpected request: ${method}`)
              const sessionId = params.sessionId
              this.emit("notification", {
                method: "session/update",
                params: {
                  sessionId,
                  update: {
                    sessionUpdate: "user_message_chunk",
                    messageId: "user-1",
                    content: { type: "text", text: "First prompt" }
                  }
                }
              })
              setTimeout(() => {
                this.emit("notification", {
                  method: "session/update",
                  params: {
                    sessionId,
                    update: {
                      sessionUpdate: "agent_message_chunk",
                      messageId: "assistant-1",
                      content: { type: "text", text: "First answer" }
                    }
                  }
                })
              }, 20)
              return { configOptions: [] }
            }
          }

          test("PI replay settle captures assistant chunks emitted after session/load resolves", async () => {
            const service = new AcpService(new LateReplayAcp(), { replaySettleMs: 60 })
            const messages = await service.messages("pi-session", true)
            assert.deepEqual(
              messages.map((message) => ({ role: message.info.role, text: message.parts.map((part) => part.text ?? "").join("") })),
              [
                { role: "user", text: "First prompt" },
                { role: "assistant", text: "First answer" }
              ]
            )
          })
          '''.replace(/^          /gm, ""))

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-settings-pi-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/App.tsx web/src/ui-regression.test.mjs bridge/src/acp-service.js bridge/src/harness-profiles.js bridge/src/cli.js bridge/src/daemon-cli.js bridge/test/pi-replay-settle.test.js
          git commit -m "fix(v3): preserve settings and complete PI history replay"
          git push origin HEAD:fix/v3-settings-pi-history

name: Android emulator matrix

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Add Capacitor Android platform
        run: |
          # The generated android/ directory is ignored, so a clean runner should not have it. If a
          # previous step left a partial directory, recreate it instead of accepting a tree without
          # the Gradle wrapper.
          rm -rf android
          npx cap add android
        working-directory: web

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
        working-directory: web

      - name: Generate Android app icon assets
        run: npx @capacitor/assets generate --android --assetPath public --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
        working-directory: web

      - name: Sync Capacitor project
        run: npm run cap:sync:android
        working-directory: web

      - name: Read app version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./web/package.json').version")
          VERSION_CODE=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log((major * 10000) + (minor * 100) + patch)" "$APP_VERSION")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sync Android version metadata
        run: node web/scripts/sync-android-version.mjs "${{ steps.version.outputs.app_version }}" "${{ steps.version.outputs.version_code }}"

      # GitHub's Ubuntu runners expose nested virtualization. The udev rule is the documented
      # kvm4all workaround used by the emulator action when /dev/kvm is present but not writable.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run background attention instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd web
            rm -rf android
            npx cap add android
            npx @capacitor/assets generate --android --assetPath public --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
            npm run cap:sync:android
            cd android
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=ai.harness.remote.BackgroundAttentionServiceTest \
              --no-daemon

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-api-${{ matrix.api-level }}
          path: web/android/app/build/reports/androidTests/connected/debug
          if-no-files-found: ignore
